# Rural HealthConnect — development / local stack.
#   ./scripts/generate-secrets.sh        (creates .env with random secrets)
#   docker compose up --build
# Open http://localhost:8080
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: rural-healthconnect

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rhc
      POSTGRES_USER: rhc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only, for local tooling. Removed in production.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhc -d rhc"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  backend:
    build: ./server
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://rhc:${POSTGRES_PASSWORD}@postgres:5432/rhc
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - uploads:/var/lib/rhc/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, frontend]

  frontend:
    build: ./client
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks: [frontend, backend]

volumes:
  pgdata:
  uploads:

networks:
  frontend:
  backend:
    internal: true
